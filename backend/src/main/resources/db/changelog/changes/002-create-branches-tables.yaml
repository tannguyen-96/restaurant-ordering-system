databaseChangeLog:
  - changeSet:
      id: 002-create-branches
      author: system
      changes:
        - createTable:
            schemaName: "order"
            tableName: "branches"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  defaultValueComputed: "gen_random_uuid()"
                  constraints:
                    primaryKey: true
              - column:
                  name: "name"
                  type: "varchar(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "address"
                  type: "varchar(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "timestamp"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "created_by"
                  type: "varchar(255)"
                  defaultValue: "system"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "timestamp"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_by"
                  type: "varchar(255)"
                  defaultValue: "system"
                  constraints:
                    nullable: false
              - column:
                  name: "deleted_at"
                  type: "timestamp"
                  constraints:
                    nullable: true
  
  - changeSet:
      id: 002-create-tables
      author: system
      changes:
        - createTable:
            schemaName: "order"
            tableName: "tables"
            columns:
              - column:
                  name: "id"
                  type: "UUID"
                  defaultValueComputed: "gen_random_uuid()"
                  constraints:
                    primaryKey: true
              - column:
                  name: "code"
                  type: "varchar(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "branch_id"
                  type: "UUID"
                  constraints:
                    nullable: false
                    foreignKeyName: "fk_tables_branch"
                    references: "\"order\".branches(id)"
              - column:
                  name: "qr_token"
                  type: "varchar(255)"
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: "status"
                  type: "varchar(255)"
                  defaultValue: "available"
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "timestamp"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "created_by"
                  type: "varchar(255)"
                  defaultValue: "system"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "timestamp"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_by"
                  type: "varchar(255)"
                  defaultValue: "system"
                  constraints:
                    nullable: false
              - column:
                  name: "deleted_at"
                  type: "timestamp"
                  constraints:
                    nullable: true