                    unique: true
              - column:
                  name: description
                  type: text
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: active
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
